name: Formal TLA+ & static bug scan
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formal-tla:
    name: "formal: TLA+ state machines"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        id: cache-tlc
        with:
          path: .tla-cache
          key: tla2tools-v1.7.4-v2
      - name: Run formal anti-cheat gates
        run: |
          python3 core/livelab/formal/gates/check_spec_pins.py
          python3 core/livelab/formal/gates/check_anchors.py
          python3 core/livelab/formal/gates/assumptions_check.py
      - name: Run TLC model checks, mutants, and witnesses across all 9 specs
        run: |
          python3 core/livelab/formal/run_formal.py --jar .tla-cache/tla2tools.jar --bootstrap --output .tla-cache/runs
  rule-ruff-bugs:
    name: "rule: Ruff high-signal bug scan"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python3 -m pip install --quiet --disable-pip-version-check ruff
      - name: Check pyflakes (F), default-call (B008), loop closure (B023), and shell=True (S602)
        run: |
          ruff check \
            --select F,B008,B023,S602 \
            --exclude core/livelab/survey/fixture \
            core/livelab repos scripts site .github/review .agents/plugins/rstack/scripts
