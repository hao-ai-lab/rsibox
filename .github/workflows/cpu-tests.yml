name: CPU tests
# Fork PRs never run on the self-hosted runner: `runs-on` below picks RSIBOX_CI_RUNNER only for
# pushes, manual runs and PRs whose head branch is in this repository. GPU and torch cases run in
# the Modal GPU CI (.github/modal-ci/), which posts the `modal-gpu` commit status.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONNOUSERSITE: "1"
  CUDA_VISIBLE_DEVICES: ""
  RSIBOX_VLLM_PYTHON: ""
jobs:
  func-conformance-cases:
    # Conformance cases fail labs that lack their property (fake labs, CPU, Python ${{ matrix.python }})
    name: "func: Test suite self-check (Py ${{ matrix.python }})"
    # requires-python is >=3.11 (pyproject.toml), so every supported minor version runs.
    # Only 3.12 may use the self-hosted runner, which has one python3; the others run on
    # GitHub-hosted runners, where setup-python installs that exact version.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ (matrix.python == '3.12' && vars.RSIBOX_CI_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && vars.RSIBOX_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: ${{ matrix.python }}
      - working-directory: core/livelab
        run: python3 -m unittest discover -s conformance -t . -v
  func-livelab-framework:
    # Framework kernel, forksafe, and conformance c0-c10 on the toy lab (CPU, Python ${{ matrix.python }})
    name: "func: Core kernel & CLI (Py ${{ matrix.python }})"
    # requires-python is >=3.11 (pyproject.toml), so every supported minor version runs.
    # Only 3.12 may use the self-hosted runner, which has one python3; the others run on
    # GitHub-hosted runners, where setup-python installs that exact version.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ (matrix.python == '3.12' && vars.RSIBOX_CI_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && vars.RSIBOX_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: ${{ matrix.python }}
      - name: Run the kernel's unittest cases on the toy engine (standard library only; torch cases skip)
        run: python3 -m unittest discover -s core/livelab/kernel -t core/livelab -v
      - name: Run forksafe's unittest cases with stand-in torch.cuda, NVML and Triton (no GPU; the real-torch case skips without torch)
        run: python3 -m unittest discover -s core/livelab -p 'test_forksafe.py' -v
      - name: Run the survey's unittest cases on its fixture tree (static scan, coverage read from lab files, history over a temporary git repository)
        run: python3 -m unittest discover -s core/livelab/survey -t core/livelab -v
      - name: Run the rsibox runtime kit, CLI, daemon, and launcher tests (IPC, process trees, hooks, overlays, BaseLab 11/11, HTTP box daemon, local/Docker/gVisor/Slurm launchers)
        run: python3 -m unittest discover -s core/livelab/rsibox -t core/livelab -v
      - name: Run rsibox doctor (core health + all engine registrations without eager GPU/torch imports)
        env:
          PYTHONPATH: core/livelab
        run: python3 -m rsibox doctor
      - name: Run site/facts and README consistency validator tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Run the CI timing comment's golden cases (API records in, the comment's numbers out; no network)
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Run the engine onboarding template skeleton golden tests
        run: python3 -m unittest discover -s template/livelab/adapter -t template/livelab -v
      - name: Run the conformance cases c0-c10 against the kernel's toy lab (2 ranks, step-gap host, session)
        working-directory: core/livelab
        run: python3 -m conformance --lab kernel.toy_lab:ToyLab
  func-fastvideo-adapter:
    # FastVideo adapter golden tests and conformance c0-c10 on the FastVideo-shaped toy (CPU, real worker processes, no FastVideo)
    name: "func: FastVideo adapter (CPU)"
    runs-on: ${{ (vars.RSIBOX_CI_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && vars.RSIBOX_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"
      - name: Run the adapter's unittest cases (spawned workers in FastVideo's pipe protocol, deadlines, a killed worker, respawn)
        run: python3 -m unittest discover -s repos/fastvideo/livelab/adapter -t repos/fastvideo/livelab -v
      - name: Run the restart services' unittest cases (zygote refresh with a real fork; the torch cases of rebuild, jitcache and holder skip without torch)
        run: python3 -m unittest discover -s repos/fastvideo/livelab/services -t repos/fastvideo/livelab -v
      - name: Run the conformance cases c0-c10 against the lab host on the toy engine (2 worker processes)
        working-directory: core/livelab
        env:
          PYTHONPATH: ${{ github.workspace }}/repos/fastvideo/livelab
        run: python3 -m conformance --lab adapter.toy_lab:ToyFastVideoLab
  func-vllm-adapter:
    # vLLM adapter golden tests on in-process ranks of the toy engine (CPU, no vLLM)
    name: "func: vLLM adapter (CPU)"
    runs-on: ${{ (vars.RSIBOX_CI_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && vars.RSIBOX_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"
      - name: Run the adapter's unittest cases (host, worker group, sides, graph detection; collective_rpc is an in-process loop)
        run: python3 -m unittest discover -s repos/vllm/livelab/adapter -t repos/vllm/livelab -v
  func-vllm-services:
    # vLLM services golden tests with fake engines (CPU; vLLM and torch cases skip)
    name: "func: vLLM services (CPU)"
    runs-on: ${{ (vars.RSIBOX_CI_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && vars.RSIBOX_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"
      - name: Create isolated job virtualenv with pytest
        run: |
          python3 -m venv "$RUNNER_TEMP/pytest-venv"
          "$RUNNER_TEMP/pytest-venv/bin/python" -m pip install --quiet --disable-pip-version-check pytest
      - name: Run the services' pytest cases (launcher, zygote, refresh) against fake vllm serve processes; cases that need vLLM (RSIBOX_VLLM_PYTHON) or torch skip and are listed (-rs)
        run: '"$RUNNER_TEMP/pytest-venv/bin/python" -m pytest -v -rs repos/vllm/livelab/services'
  func-megatron-livelab:
    # Megatron live-lab and tool golden tests (CPU; torch cases skip)
    name: "func: Megatron adapter (CPU)"
    runs-on: ${{ (vars.RSIBOX_CI_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && vars.RSIBOX_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"
      - name: Run Megatron live-lab unittest cases (overlay, mailbox, phase stamps, zygote; torch cases skip)
        run: python3 -m unittest discover -s repos/megatron/livelab/rsibox_megatron -t repos/megatron/livelab -v
      - name: Run Megatron tool unittest cases when present (local-disk environment staging)
        run: |
          if [ -d repos/megatron/tools ]; then
            python3 -m unittest discover -s repos/megatron/tools -v
          fi
  func-verl-adapter:
    # veRL adapter, CLI tools, and conformance c0-c10 on the veRL-shaped toy (CPU, no Ray/verl)
    name: "func: veRL adapter (CPU)"
    runs-on: ${{ (vars.RSIBOX_CI_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && vars.RSIBOX_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"
      - name: Run veRL adapter golden tests (ray cases skip without ray)
        run: python3 -m unittest discover -s repos/verl/livelab/adapter -t repos/verl/livelab -v
      - name: Run veRL CLI and offline probe golden tests
        run: python3 -m unittest discover -s repos/verl/tools -t repos/verl -v
      - name: Run conformance c0-c10 against ToyVerlLab via unified CLI
        env:
          PYTHONPATH: ${{ github.workspace }}/core/livelab
        run: python3 -m rsibox conformance verl
  func-miles-adapter:
    # miles adapter golden tests and conformance c0-c10 on the miles-shaped toy (CPU, no Ray/miles)
    name: "func: miles adapter (CPU)"
    runs-on: ${{ (vars.RSIBOX_CI_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && vars.RSIBOX_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"
      - name: Run miles adapter golden tests (ray cases skip without ray)
        run: python3 -m unittest discover -s repos/miles/livelab/adapter -t repos/miles/livelab -v
      - name: Run conformance c0-c10 against ToyMilesLab via unified CLI
        env:
          PYTHONPATH: ${{ github.workspace }}/core/livelab
        run: python3 -m rsibox conformance miles
  func-sglang-adapter:
    # SGLang adapter, zygote services, and conformance c0-c10 on the SGLang-shaped toy (CPU, no SGLang)
    name: "func: SGLang adapter (CPU)"
    runs-on: ${{ (vars.RSIBOX_CI_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && vars.RSIBOX_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"
      - name: Run SGLang adapter golden tests (real spawned toy TP workers)
        run: python3 -m unittest discover -s repos/sglang/livelab/adapter -t repos/sglang/livelab -v
      - name: Run SGLang zygote golden tests (real fork, forksafe, linecache refresh)
        run: python3 -m unittest discover -s repos/sglang/livelab/services -t repos/sglang/livelab -v
      - name: Run conformance c0-c10 against ToySglangLab via unified CLI
        env:
          PYTHONPATH: ${{ github.workspace }}/core/livelab
        run: python3 -m rsibox conformance sglang
  func-transformers-adapter:
    # HuggingFace Transformers adapter golden tests and conformance c0-c10 on the toy_hf fixture (CPU, no torch/transformers)
    name: "func: Transformers adapter (CPU)"
    runs-on: ${{ (vars.RSIBOX_CI_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && vars.RSIBOX_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"
      - name: Run Transformers adapter golden tests (real spawned toy worker, quiesce hooks; torch/transformers cases skip without deps)
        run: python3 -m unittest discover -s repos/transformers/livelab/adapter -t repos/transformers/livelab -v
      - name: Run conformance c0-c10 against ToyTransformersLab via unified CLI
        env:
          PYTHONPATH: ${{ github.workspace }}/core/livelab
        run: python3 -m rsibox conformance transformers
  func-trtllm-adapter:
    # TensorRT-LLM adapter golden tests and conformance c0-c10 on the TRT-LLM-shaped toy (CPU, no TRT-LLM)
    name: "func: TRT-LLM adapter (CPU)"
    runs-on: ${{ (vars.RSIBOX_CI_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && vars.RSIBOX_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"
      - name: Run TRT-LLM adapter golden tests (real spawned toy workers, snapshot hooks, fail-closed checks)
        run: python3 -m unittest discover -s repos/trtllm/livelab/adapter -t repos/trtllm/livelab -v
      - name: Run conformance c0-c10 against ToyTrtllmLab via unified CLI
        env:
          PYTHONPATH: ${{ github.workspace }}/core/livelab
        run: python3 -m rsibox conformance trtllm
  func-torchtitan-adapter:
    # TorchTitan / FSDP2 adapter golden tests and conformance c0-c10 on 2-rank CPU fake-distributed workers (no torch/GPU)
    name: "func: TorchTitan adapter (CPU)"
    runs-on: ${{ (vars.RSIBOX_CI_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && vars.RSIBOX_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"
      - name: Run TorchTitan adapter golden tests and 2-rank conformance c0-c10 (CUDA FSDP2 case skips without GPU)
        run: python3 -m unittest discover -s repos/torchtitan/livelab/adapter -t repos/torchtitan/livelab -v
      - name: Run conformance c0-c10 against ToyTorchTitanLab via unified CLI
        env:
          PYTHONPATH: ${{ github.workspace }}/core/livelab
        run: python3 -m rsibox conformance torchtitan
  func-modal-ci-runner:
    # Modal GPU CI runner and loop golden cases (CPU; real git mirror/archive, stand-in modal CLI, no GitHub calls)
    name: "func: GPU CI runner self-test (CPU)"
    runs-on: ${{ (vars.RSIBOX_CI_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && vars.RSIBOX_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"
      - name: Run Modal GPU CI runner golden tests
        run: python3 .github/modal-ci/test_modal_ci.py -v
