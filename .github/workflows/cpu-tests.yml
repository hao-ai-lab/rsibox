name: CPU tests
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  conformance-cases:
    name: Conformance cases fail labs that lack their property (fake labs, CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the conformance cases against fake labs, each missing one property (standard library only)
        working-directory: template/livelab
        run: python3 -m unittest discover -s conformance -t . -v
  vllm-kernel:
    name: vLLM kernel golden tests and conformance c0-c10 on the toy lab (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the kernel's unittest cases on the toy engine (standard library only; torch cases skip)
        run: python3 -m unittest discover -s repos/vllm/livelab/kernel -t repos/vllm/livelab -v
      - name: Run the template conformance cases c0-c10 against the kernel's toy lab (2 ranks, step-gap host, session)
        working-directory: template/livelab
        env:
          PYTHONPATH: ${{ github.workspace }}/repos/vllm/livelab
        run: python3 -m conformance --lab kernel.toy_lab:ToyLab
  vllm-adapter:
    name: vLLM adapter golden tests on in-process ranks of the toy engine (CPU, no vLLM)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the adapter's unittest cases (host, worker group, sides, graph detection; collective_rpc is an in-process loop)
        run: python3 -m unittest discover -s repos/vllm/livelab/adapter -t repos/vllm/livelab -v
  vllm-services:
    name: vLLM services golden tests with fake engines (CPU; vLLM and torch cases skip)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install pytest
      - name: Run the services' pytest cases (launcher, zygote, refresh) against fake vllm serve processes; cases that need vLLM (FASTRSI_VLLM_PYTHON) or torch skip and are listed (-rs)
        run: python3 -m pytest -v -rs repos/vllm/livelab/services
