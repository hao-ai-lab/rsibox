name: CPU tests
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  conformance-cases:
    name: Conformance cases fail labs that lack their property (fake labs, CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: template/livelab
        run: python3 -m unittest discover -s conformance -t . -v
  vllm-kernel:
    name: vLLM kernel golden tests and conformance c0-c10 on the toy lab (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the kernel's unittest cases on the toy engine (standard library only; torch cases skip)
        run: python3 -m unittest discover -s repos/vllm/livelab/kernel -t repos/vllm/livelab -v
      - name: Run the template conformance cases c0-c10 against the kernel's toy lab (2 ranks, step-gap host, session)
        working-directory: template/livelab
        env:
          PYTHONPATH: ${{ github.workspace }}/repos/vllm/livelab
        run: python3 -m conformance --lab kernel.toy_lab:ToyLab
