name: PR code review
# Agent code review is opt-in: the repository owner comments `/review` on a PR (or runs the
# workflow by hand). Pushes run only the fast checker; merging never waits for a review, and
# findings are fixed afterwards in batches (AGENTS.md, "Handling review findings").
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/review/**', '.github/workflows/pr-code-review.yml']
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review
        required: true
permissions: {}
jobs:
  review-filter-selftest:
    # Code review checker keeps only diff-anchored findings and never approves (golden cases)
    name: "review: Filter self-test"
    if: github.event_name == 'pull_request'
    # Runs the PR's own code, so it gets a read-only token that checkout does not keep.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 .github/review/test_code_review.py -v
  review-code:
    # Agent code review (agy, codex) via the review service, posted as one COMMENT review
    name: "review: Automated code review"
    # Only on demand: a `/review` comment on a PR by the repository owner, or a manual run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/review') &&
       github.event.comment.user.login == github.repository_owner)
    # Job-level, so a run that skips this job (another label added) cannot cancel a review.
    concurrency:
      group: code-review-${{ github.event.issue.number || inputs.pr }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The review code runs from the base commit, never from the PR: this job holds the service
      # token and a write-enabled GitHub token, and a PR could otherwise change the script that
      # uses them. The PR itself is read through the API as data.
      # issue_comment and workflow_dispatch both run on the default branch (github.sha).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Acknowledge the /review comment
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes >/dev/null || true
      - env:
          GH_TOKEN: ${{ github.token }}
          RSIBOX_REVIEW_URL: ${{ vars.RSIBOX_REVIEW_URL || vars.FASTRSI_REVIEW_URL }}
          RSIBOX_REVIEW_TOKEN: ${{ secrets.RSIBOX_REVIEW_TOKEN || secrets.FASTRSI_REVIEW_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PR: ${{ github.event.issue.number || inputs.pr }}
        run: |
          if [ ! -f .github/review/code_review.py ]; then
            echo "::notice::The base commit has no code review yet (it arrives with this PR). Skipped."
            exit 0
          fi
          python3 .github/review/code_review.py --pr "$PR" --engines agy,codex --post
