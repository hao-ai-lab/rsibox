name: PR rules
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
jobs:
  title:
    name: Title is <type>(<scope>) summary (see AGENTS.md)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Title: $PR_TITLE"
          if printf '%s' "$PR_TITLE" | grep -Eq '^(feat|fix|perf|docs|test|ci|refactor|chore)\([a-z0-9-]+\)!?: .+'; then
            echo "OK"
          else
            echo "Expected <type>(<scope>): <summary>, e.g. feat(vllm): replay PR 62240 in the live lab"
            echo "Types: feat fix perf docs test ci refactor chore. Breaking: add ! before the colon."
            exit 1
          fi
  attribution:
    name: No AI co-authors or generated-with lines (see AGENTS.md)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='(co-authored-by:.*(claude|anthropic|codex|openai|gemini|antigravity|copilot))|generated with \[?(claude|codex|gemini|antigravity)'
          bad=0
          if git log --format=%B "$BASE..$HEAD" | grep -Eiq "$pattern"; then
            echo "A commit message names an AI co-author or has a generated-with line:"
            git log --format='%h %s' "$BASE..$HEAD"; bad=1
          fi
          if printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -Eiq "$pattern"; then
            echo "The PR title or description names an AI co-author or has a generated-with line."; bad=1
          fi
          [ $bad = 0 ] && echo "OK: checked $(git rev-list --count "$BASE..$HEAD") commits and the PR text"
          exit $bad
  loop-record:
    name: PRs that change repos/<engine>/ fill every Loop record field (presence only, see AGENTS.md)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD")
          engines=$(printf '%s\n' "$changed" | sed -n 's|^repos/\([^/]*\)/.*|\1|p' | sort -u)
          if [ -z "$engines" ]; then echo "OK: no file under repos/<engine>/ changed; no loop record needed"; exit 0; fi
          echo "Engines changed: $engines"
          printf '%s' "$PR_BODY" | python3 -c '
          import re, sys
          body = re.sub(r"<!--.*?-->", "", sys.stdin.read().replace("\r", ""), flags=re.S)
          m = re.search(r"^## Loop record\s*$(.*?)(?=^## |\Z)", body, flags=re.M | re.S)
          if not m:
              sys.exit("Missing a \"## Loop record\" section (see .github/pull_request_template.md)")
          fields = ["Engine", "Upstream PRs", "Function groups", "Rule added",
                    "Overheads measured", "Receipts", "Not verified"]
          empty = [f for f in fields
                   if not re.search(r"^- " + f + r":[ \t]*\S", m.group(1), flags=re.M)]
          if empty:
              sys.exit("Loop record fields with no text (write none if it does not apply): " + ", ".join(empty))
          print("OK: every loop record field has text. Not checked: whether it is true.")
          '
