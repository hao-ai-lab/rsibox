name: PR rules
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: Optional PR number to validate (omit to check the dispatched ref)
        required: false
permissions:
  contents: read
  pull-requests: read
jobs:
  rule-pr-title:
    # Title is <type>(<scope>) summary (see AGENTS.md)
    name: "rule: PR title format"
    runs-on: ${{ (vars.FASTRSI_CI_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && vars.FASTRSI_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "$INPUT_PR" ]; then
              echo "OK: workflow_dispatch without pr input; skipping PR-only title check"
              exit 0
            fi
            printf '%s' "$INPUT_PR" | grep -Eq '^[0-9]+$' || { echo "Invalid pr input"; exit 1; }
            PR_TITLE=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$INPUT_PR" --jq '.title')
          fi
          echo "Title: $PR_TITLE"
          if printf '%s' "$PR_TITLE" | grep -Eq '^(feat|fix|perf|docs|test|ci|refactor|chore)\([a-z0-9-]+\)!?: .+'; then
            echo "OK"
          else
            echo "Expected <type>(<scope>): <summary>, e.g. feat(vllm): replay PR 62240 in the live lab"
            echo "Types: feat fix perf docs test ci refactor chore. Breaking: add ! before the colon."
            exit 1
          fi
  rule-no-ai-attribution:
    # No AI co-authors or generated-with lines (see AGENTS.md)
    name: "rule: No AI attribution trailers"
    runs-on: ${{ (vars.FASTRSI_CI_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && vars.FASTRSI_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_PR" ]; then
              printf '%s' "$INPUT_PR" | grep -Eq '^[0-9]+$' || { echo "Invalid pr input"; exit 1; }
              PR_JSON=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$INPUT_PR")
              PR_TITLE=$(printf '%s' "$PR_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("title") or "")')
              PR_BODY=$(printf '%s' "$PR_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("body") or "")')
              BASE=$(printf '%s' "$PR_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["base"]["sha"])')
              HEAD=$(printf '%s' "$PR_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')
              git fetch --no-tags origin "$BASE" "+refs/pull/$INPUT_PR/head"
            else
              HEAD=$(git rev-parse HEAD)
              BASE=$(git merge-base "origin/${DEFAULT_BRANCH:-main}" "$HEAD" || true)
              if [ -z "$BASE" ] || [ "$BASE" = "$HEAD" ]; then
                BASE=$(git rev-parse "${HEAD}~1" 2>/dev/null || printf '%s' "$HEAD")
              fi
            fi
          fi
          pattern='(co-authored-by:.*(claude|anthropic|codex|openai|gemini|antigravity|copilot))|generated with \[?(claude|codex|gemini|antigravity)'
          bad=0
          if git log --format=%B "$BASE..$HEAD" | grep -Eiq "$pattern"; then
            echo "A commit message names an AI co-author or has a generated-with line:"
            git log --format='%h %s' "$BASE..$HEAD"; bad=1
          fi
          if printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -Eiq "$pattern"; then
            echo "The PR title or description names an AI co-author or has a generated-with line."; bad=1
          fi
          [ $bad = 0 ] && echo "OK: checked $(git rev-list --count "$BASE..$HEAD") commits and the PR text"
          exit $bad
  rule-leak-check:
    # Added lines have no common env-detail or secret patterns (pattern check, not a guarantee)
    name: "rule: Secret & internal path scan"
    runs-on: ${{ (vars.FASTRSI_CI_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && vars.FASTRSI_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_PR" ]; then
              printf '%s' "$INPUT_PR" | grep -Eq '^[0-9]+$' || { echo "Invalid pr input"; exit 1; }
              PR_JSON=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$INPUT_PR")
              BASE=$(printf '%s' "$PR_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["base"]["sha"])')
              HEAD=$(printf '%s' "$PR_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')
              git fetch --no-tags origin "$BASE" "+refs/pull/$INPUT_PR/head"
            else
              HEAD=$(git rev-parse HEAD)
              BASE=$(git merge-base "origin/${DEFAULT_BRANCH:-main}" "$HEAD" || true)
              if [ -z "$BASE" ] || [ "$BASE" = "$HEAD" ]; then
                BASE=$(git rev-parse "${HEAD}~1" 2>/dev/null || printf '%s' "$HEAD")
              fi
            fi
          fi
          bash .github/scripts/leak-check.sh "$BASE" "$HEAD"
      - name: Run leak-check golden self-tests
        run: python3 .github/review/test_leak_check.py -v
  docs-loop-record:
    # PRs that change repos/<engine>/ fill every Loop record field (presence only, see AGENTS.md)
    name: "docs: PR description GPU report check"
    runs-on: ${{ (vars.FASTRSI_CI_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && vars.FASTRSI_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_PR" ]; then
              printf '%s' "$INPUT_PR" | grep -Eq '^[0-9]+$' || { echo "Invalid pr input"; exit 1; }
              PR_JSON=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$INPUT_PR")
              PR_BODY=$(printf '%s' "$PR_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("body") or "")')
              BASE=$(printf '%s' "$PR_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["base"]["sha"])')
              HEAD=$(printf '%s' "$PR_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')
              git fetch --no-tags origin "$BASE" "+refs/pull/$INPUT_PR/head"
            else
              HEAD=$(git rev-parse HEAD)
              BASE=$(git merge-base "origin/${DEFAULT_BRANCH:-main}" "$HEAD" || true)
              if [ -z "$BASE" ] || [ "$BASE" = "$HEAD" ]; then
                BASE=$(git rev-parse "${HEAD}~1" 2>/dev/null || printf '%s' "$HEAD")
              fi
            fi
          fi
          changed=$(git diff --name-only "$BASE...$HEAD")
          engines=$(printf '%s\n' "$changed" | sed -n 's|^repos/\([^/]*\)/.*|\1|p' | sort -u)
          core_livelab=$(printf '%s\n' "$changed" | grep -E '^core/livelab/' || true)
          if [ -z "$engines" ] && [ -z "$core_livelab" ]; then
            echo "OK: no file under repos/<engine>/ or core/livelab/ changed; no loop record or GPU verification contract needed"
            exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -z "$INPUT_PR" ]; then
            echo "::notice::workflow_dispatch without pr input; pass -f pr=<number> to validate PR Loop record body"
            exit 0
          fi
          echo "Engines changed: ${engines:-none}; core/livelab changed: $([ -n "$core_livelab" ] && echo yes || echo no)"
          printf '%s' "$PR_BODY" | HAS_ENGINE=$([ -n "$engines" ] && echo 1 || echo 0) python3 -c '
          import os, re, sys
          body = re.sub(r"<!--.*?-->", "", sys.stdin.read().replace("\r", ""), flags=re.S)
          if os.environ.get("HAS_ENGINE") == "1":
              m = re.search(r"^## Loop record\s*$(.*?)(?=^## |\Z)", body, flags=re.M | re.S)
              if not m:
                  sys.exit("Missing a \"## Loop record\" section (see .github/pull_request_template.md)")
              fields = ["Engine", "Upstream PRs", "Function groups", "Rule added",
                        "Overheads measured", "Receipts", "Not verified"]
              empty = [f for f in fields
                       if not re.search(r"^- " + f + r":[ \t]*\S", m.group(1), flags=re.M)]
              if empty:
                  sys.exit("Loop record fields with no text (write none if it does not apply): " + ", ".join(empty))
          gpu_fields = ["Ideal full GPU test", "Actual tests run", "Why unrun GPU paths were skipped"]
          empty_gpu = [f for f in gpu_fields
                       if not re.search(r"^- " + f + r":[ \t]*\S", body, flags=re.M)]
          if empty_gpu:
              sys.exit("GPU verification fields with no text (mandatory when repos/<engine>/ or core/livelab/ changes): " + ", ".join(empty_gpu))
          print("OK: every required loop record and 3-part GPU verification field has text.")
          '
  rule-cross-engine-imports:
    # No repos/<engine>/ code imports from another repos/<other>/ (shared code goes to core/livelab)
    name: "rule: No cross-engine imports"
    runs-on: ${{ (vars.FASTRSI_CI_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && vars.FASTRSI_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - run: |
          bad=0
          for dir in repos/*/; do
            engine=$(basename "$dir")
            for other in repos/*/; do
              o=$(basename "$other")
              [ "$o" = "$engine" ] && continue
              hits=$(grep -rnE --include='*.py' --include='*.sh' \
                "repos/$o/|\.\./$o/|[\"']$o[\"'], *[\"']livelab[\"']" "$dir" || true)
              if [ -n "$hits" ]; then
                echo "repos/$engine/ references repos/$o/:"; printf '%s\n' "$hits"; bad=1
              fi
            done
          done
          [ $bad = 0 ] && echo "OK: no Python or shell file under repos/<engine>/ references another engine's folder"
          exit $bad
