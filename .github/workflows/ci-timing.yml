name: CI timing comment
# After "CPU tests" finishes on a pull request, write one comment on that pull request that says
# where the CI time went: wall-clock, queue time, and run time per job with its slowest step.
# The comment is updated in place on every push.
#
# `workflow_run` always runs this file and the script from the default branch, never from the
# pull request, so the write token below is not exposed to pull request code. The script reads
# run, job and step records from the Actions API only. It costs one job of a few seconds.
on:
  workflow_run:
    workflows: ["CPU tests"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Head commit to report on (40 hex characters)
        required: true
      pr:
        description: Pull request number to comment on
        required: true
permissions: {}
concurrency:
  group: ci-timing-${{ github.event.workflow_run.head_sha || inputs.sha }}
  cancel-in-progress: true
jobs:
  comment:
    name: Comment the CI time per job and step on the pull request (reads the Actions API; runs no tests)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request'
    permissions:
      contents: read
      actions: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          clean: true
          persist-credentials: false
      - name: Build the timing table from the commit's workflow runs and create or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
          INPUT_PR: ${{ inputs.pr }}
        run: |
          printf '%s' "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "Invalid sha"; exit 1; }
          if [ -n "$INPUT_PR" ]; then
            printf '%s' "$INPUT_PR" | grep -Eq '^[0-9]+$' || { echo "Invalid pr input"; exit 1; }
            python3 .github/scripts/ci_timing_comment.py --repo "$GITHUB_REPOSITORY" --sha "$HEAD_SHA" --pr "$INPUT_PR" --post
          else
            python3 .github/scripts/ci_timing_comment.py --repo "$GITHUB_REPOSITORY" --sha "$HEAD_SHA" --post
          fi
