name: Publish the website to GitHub Pages

# Publishes site/deck/ (the interactive RSIBox website) to https://hao-ai-lab.github.io/rsibox/.

on:
  push:
    branches: [main]
    paths:
      - "site/deck/**"
      - "site/landing/dash/data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # site/deck/data links to site/landing/dash/data; -L copies the real CSVs into the site.
      - name: Assemble the site
        run: cp -RL site/deck _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
