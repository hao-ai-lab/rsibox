[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastrsi"
version = "0.0.1"
description = "Edit a running ML engine without restarting it, and prove what happened"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
fastrsi = "fastrsi.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/fastrsi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
