[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rsibox"
version = "0.1.0"
description = "Shared engine-agnostic live-lab transaction kernel, stdlib runtime kit, conformance suite, and pre-fork CUDA guards for rsibox."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rsibox = "rsibox.cli:main"

# `core/livelab` is the shared import root (`PYTHONPATH=core/livelab`) used by
# `rsibox.cli`, `rsibox.lab`, `forksafe`, `ray_participants`, and every engine
# adapter under `repos/*/livelab/`, so exposing these top-level names is
# intentional. Offline editable installs require standard PEP 517 isolation
# opt-out (`pip install --no-build-isolation --no-deps -e .`).
#
# Setuptools `packages` globs every `*.py` file in a package directory via
# `build_py.find_package_modules` and `exclude-package-data` only filters data
# files, not Python modules. Keeping `packages = []` with `include-package-data`
# disabled and enumerating runtime modules in `py-modules` (each package's
# `__init__.py` is auto-included) excludes all `test_*.py` / `*_test.py` files
# and `survey/fixture/` from built wheels and sdists (`scripts/test_packaging.py`
# verifies this list stays in sync with `core/livelab`).
[tool.setuptools]
package-dir = { "" = "core/livelab" }
packages = []
include-package-data = false
py-modules = [
  "forksafe",
  "livestream",
  "ray_participants",
  "conformance.__main__",
  "conformance.cases",
  "conformance.lab",
  "rsibox.__main__",
  "rsibox.autoscaler",
  "rsibox.cli",
  "rsibox.lab_cli",
  "rsibox.diffs",
  "rsibox.doctor",
  "rsibox.harness",
  "rsibox.hooks",
  "rsibox.ipc",
  "rsibox.lab",
  "rsibox.op_guard",
  "rsibox.pool",
  "rsibox.proc",
  "rsibox.promote",
  "kernel.coordinator",
  "kernel.findings",
  "kernel.identity",
  "kernel.jit",
  "kernel.journal",
  "kernel.locate",
  "kernel.receipt",
  "kernel.reinit",
  "kernel.session",
  "kernel.swap",
  "kernel.toy.engine",
  "kernel.toy.ops",
  "kernel.toy_lab",
  "kernel.witness",
  "rsibox.box",
  "rsibox.client",
  "rsibox.gvisor",
  "rsibox.launch",
  "rsibox.server",
  "rsibox.services.memory",
  "rsibox.services.zygote",
  "rsibox.warm.dynamo_gms",
  "rsibox.warm.recovery",
  "rsibox.warm.snapshot_contract",
  "rsibox.warm.types",
  "rsibox.warm.weight_store",
  "survey.__main__",
  "survey.history",
  "survey.rules",
  "survey.scan",
]

[tool.ruff.lint.per-file-ignores]
"core/livelab/kernel/toy/ops.py" = ["F841"]

[tool.pyright]
pythonVersion = "3.11"
extraPaths = ["core/livelab"]
typeCheckingMode = "basic"
include = [
  "core/livelab/kernel/__init__.py",
  "core/livelab/kernel/findings.py",
  "core/livelab/kernel/identity.py",
  "core/livelab/kernel/jit.py",
  "core/livelab/kernel/receipt.py",
  "core/livelab/kernel/toy/engine.py",
  "core/livelab/kernel/toy_lab.py",
  "core/livelab/rsibox/__init__.py",
  "core/livelab/rsibox/__main__.py",
  "core/livelab/rsibox/client.py",
  "core/livelab/rsibox/diffs.py",
  "core/livelab/rsibox/doctor.py",
  "core/livelab/rsibox/gvisor.py",
  "core/livelab/rsibox/hooks.py",
  "core/livelab/rsibox/proc.py",
  "core/livelab/rsibox/services/__init__.py",
  "core/livelab/rsibox/services/memory.py",
  "core/livelab/rsibox/services/zygote.py",
  "core/livelab/rsibox/warm/__init__.py",
  "core/livelab/rsibox/warm/snapshot_contract.py",
  "core/livelab/rsibox/warm/types.py",
  "core/livelab/rsibox/warm/weight_store.py",
]
